<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:8px;">
          <tr>
            <td style="padding:28px 32px 8px;font-family:Georgia,serif;font-size:22px;color:#1c2430;">
              {{from_name}}
            </td>
          </tr>
          <tr>
            <td style="padding:8px 32px 24px;font-family:Arial,sans-serif;font-size:16px;line-height:1.5;color:#1c2430;">
              <p style="margin:0 0 16px;">Hi {{first_name}},</p>
              <p style="margin:0;">Replace this paragraph with the campaign you actually want to send.</p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px 28px;font-family:Arial,sans-serif;font-size:12px;line-height:1.5;color:#5c6773;border-top:1px solid #e6e8eb;">
              <p style="margin:0 0 8px;">{{physical_address}}</p>
              <p style="margin:0;"><a href="{{unsubscribe_url}}" style="color:#5c6773;">Unsubscribe</a></p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
